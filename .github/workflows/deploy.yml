name: Deploy Dhaan Mitra to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install and build Mobile App (Farmer & Procurer)
        run: |
          cd mobile-app
          npm install
          npm run build
          cd ..

      - name: Install and build Admin Web (State Command Center)
        run: |
          cd admin-web
          npm install
          npm run build
          cd ..

      - name: Assemble public website package
        run: |
          mkdir -p public_deploy
          # Copy admin portal to root and /admin
          cp -r admin-web/dist/* public_deploy/
          mkdir -p public_deploy/admin
          cp -r admin-web/dist/* public_deploy/admin/
          # Copy mobile app to /farmer and /procurer and /mobile
          mkdir -p public_deploy/farmer
          cp -r mobile-app/dist/* public_deploy/farmer/
          mkdir -p public_deploy/procurer
          cp -r mobile-app/dist/* public_deploy/procurer/
          mkdir -p public_deploy/mobile
          cp -r mobile-app/dist/* public_deploy/mobile/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_deploy'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
